name: Rebuild prismlauncher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pkgs/prismlauncher/**"

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: roudix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build prismlauncher
        run: nix build .#prismlauncher-custom .#prismlauncher-wrapped-custom --print-build-logs
