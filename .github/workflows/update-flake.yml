name: Update flake.lock

on:
  schedule:
    - cron: "0 3 * * *"   # tous les jours à 3h UTC (avant le workflow scxctl à 4h)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Update flake.lock
        run: nix flake update

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            echo "Already up to date, nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update flake.lock"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # flake.lock a changé → rebuild + push Cachix.
  # (Un push fait par GITHUB_TOKEN ne déclenche pas build-all.yml tout seul,
  # d'où l'appel explicite.)
  rebuild:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build-all.yml
    secrets: inherit
    permissions:
      contents: write
