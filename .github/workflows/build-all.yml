name: Build all & push to Cachix

# Rebuild tous les paquets et pousse tout sur roudix.cachix.org.
#
# Déclencheurs :
#   - push sur main qui touche flake.lock / flake.nix (commit fait à la main)
#   - workflow_call depuis update-flake.yml (un push fait avec GITHUB_TOKEN ne
#     déclenche PAS les autres workflows, donc update-flake nous appelle
#     explicitement)
#   - workflow_dispatch (bouton manuel)
#

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flake.lock"
      - "flake.nix"

concurrency:
  group: build-all
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # toujours le dernier main (inclut le flake.lock fraîchement poussé)
          fetch-depth: 0

      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: roudix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # --keep-going : un échec ne bloque pas les autres paquets,
      # ce qui est déjà construit part quand même sur Cachix.
      - name: Build all packages
        run: |
          nix build \
            .#heroic-custom \
            .#scxctl \
            .#faugus \
            .#openlinkhub \
            .#scx.full \
            .#prismlauncher-custom \
            .#prismlauncher-wrapped-custom \
            --no-link --keep-going --print-build-logs
