name: Check scx updates

on:
  schedule:
    - cron: "17 6 * * *" # tous les jours à 06:17 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4

      - name: Get latest scx release tag
        id: latest
        run: |
          latest_tag=$(curl -sSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/sched-ext/scx/releases/latest \
            | jq -r '.tag_name')
          # tag_name est de la forme "v1.1.3"
          echo "version=${latest_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Compare with pinned version
        id: current
        run: |
          current=$(jq -r '.version' pkgs/scx/version.json)
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Bump if newer
        if: steps.latest.outputs.version != steps.current.outputs.version
        id: bump
        run: |
          new_version="${{ steps.latest.outputs.version }}"
          echo "Bumping scx: ${{ steps.current.outputs.version }} -> ${new_version}"

          # reset le hash à fakeHash — corrigé juste après via nix-prefetch-github
          jq --arg v "$new_version" \
             '.version = $v | .srcHash = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="' \
             pkgs/scx/version.json > pkgs/scx/version.json.tmp
          mv pkgs/scx/version.json.tmp pkgs/scx/version.json
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - uses: DeterminateSystems/nix-installer-action@main
        if: steps.bump.outputs.bumped == 'true'

      - name: Prefetch real src hash
        if: steps.bump.outputs.bumped == 'true'
        run: |
          real_hash=$(nix run nixpkgs#nix-prefetch-github -- \
            sched-ext scx --rev "v${{ steps.latest.outputs.version }}" \
            | jq -r '.hash')
          jq --arg h "$real_hash" '.srcHash = $h' pkgs/scx/version.json > pkgs/scx/version.json.tmp
          mv pkgs/scx/version.json.tmp pkgs/scx/version.json

      - name: Commit and push
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git config user.name "roudix-caches-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pkgs/scx/version.json
          git commit -m "scx: ${{ steps.current.outputs.version }} -> ${{ steps.latest.outputs.version }}"
          git push

  # Une fois le bump poussé, on relance directement le build pour vérifier
  # que ça compile toujours avec cette nouvelle version et pousser sur Cachix.
  trigger-build:
    needs: check
    if: needs.check.outputs.bumped == 'true'
    uses: ./.github/workflows/build-scx.yml
    secrets: inherit
