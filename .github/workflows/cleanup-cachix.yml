name: Cleanup Cachix (garde uniquement la dernière version par paquet)

on:
  schedule:
    - cron: "0 3 * * 0"   # tous les dimanches à 3h UTC
  workflow_dispatch: {}

jobs:
  pin-latest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── 1. Installer Nix + cachix ──────────────────────────────────────
      - uses: cachix/install-nix-action@v26
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v14
        with:
          name: roudix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # ── 2. Lister les paquets exposés par le flake ─────────────────────
      - name: Debug - contenu du dossier et du flake
        run: |
          echo "=== Répertoire courant ==="
          pwd
          ls -la
          echo ""
          echo "=== nix flake show (sortie brute, sans filtrer les erreurs) ==="
          nix flake show --json || true

      - name: Lister les paquets du flake
        id: pkgs
        run: |
          RAW=$(nix flake show --json)
          echo "$RAW" | jq .

          PACKAGES=$(echo "$RAW" | jq -r '.packages."x86_64-linux" | keys[]')

          if [ -z "$PACKAGES" ]; then
            echo "Aucun paquet trouvé sous .packages.x86_64-linux — regarde la sortie JSON ci-dessus pour voir la vraie structure (legacyPackages ? autre system ? etc.)"
            exit 1
          fi

          echo "Paquets trouvés :"
          echo "$PACKAGES"

          echo "packages<<EOF" >> "$GITHUB_OUTPUT"
          echo "$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ── 3. Build (substitution depuis le cache) + pin en gardant 1 seule révision ──
      - name: Pin la dernière révision de chaque paquet
        run: |
          echo "${{ steps.pkgs.outputs.packages }}" | while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "=== $pkg ==="

            STORE_PATH=$(nix build ".#$pkg" --no-link --print-out-paths 2>/dev/null | tail -n1)

            if [ -z "$STORE_PATH" ]; then
              echo "  ⚠️  build/substitution échouée pour $pkg, skip"
              continue
            fi

            echo "  store path : $STORE_PATH"

            # --keep-revisions 1 : ne garde que la révision qu'on vient de pousser,
            # la précédente sous ce même nom de pin est supprimée par Cachix.
            cachix pin roudix "$pkg" "$STORE_PATH" --keep-revisions 1
          done

      # ── 4. Résumé ────────────────────────────────────────────────────
      - name: Write summary
        run: |
          {
            echo "## 🗑️ Cachix Cleanup Summary"
            echo ""
            echo "- **Cache** : roudix"
            echo "- **Stratégie** : 1 pin par paquet, --keep-revisions 1"
            echo "- **Déclenché par** : ${{ github.event_name }}"
            echo "- **Date** : $(date -u)"
            echo ""
            echo "Paquets traités :"
            echo '```'
            echo "${{ steps.pkgs.outputs.packages }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
