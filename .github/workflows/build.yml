name: Update and build packages

on:
  schedule:
    - cron: "0 8 * * *" # tous les jours à 8h
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: roudix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # ── 1. Versions courantes extraites des fichiers nix ──────────────────
      - name: Read current versions
        id: current
        run: |
          NIX="pkgs/heroic/default.nix"
          LEG="pkgs/heroic/legendary-gl.nix"

          HEROIC_CUR=$(grep -oP 'version\s*=\s*"\K[^"]+' "$NIX" | head -1)
          LEG_CUR=$(grep    -oP 'version\s*=\s*"\K[^"]+' "$LEG" | head -1)

          echo "heroic=$HEROIC_CUR"      >> "$GITHUB_OUTPUT"
          echo "legendary=$LEG_CUR"      >> "$GITHUB_OUTPUT"

          echo "=== Versions actuelles ==="
          echo "heroic:      $HEROIC_CUR"
          echo "legendary-gl: $LEG_CUR"

      # ── 2. Versions upstream ────────────────────────────────────────────────
      - name: Fetch upstream versions
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEROIC_TAG=$(gh release view \
            --repo Heroic-Games-Launcher/HeroicGamesLauncher \
            --json tagName -q .tagName)
          HEROIC_NEW="${HEROIC_TAG#v}"

          # legendary-gl/legendary n'a pas de "GitHub Release", seulement des
          # tags nus ("0.21.1", pas "v0.21.1"). On prend le plus récent par
          # tri de version.
          LEG_NEW=$(gh api repos/legendary-gl/legendary/tags --paginate -q '.[].name' \
            | sort -V | tail -1)

          echo "heroic=$HEROIC_NEW"      >> "$GITHUB_OUTPUT"
          echo "heroic_tag=$HEROIC_TAG"  >> "$GITHUB_OUTPUT"
          echo "legendary=$LEG_NEW"      >> "$GITHUB_OUTPUT"

          echo "=== Versions upstream ==="
          echo "heroic:      $HEROIC_NEW"
          echo "legendary-gl: $LEG_NEW"

      # ── 3. Détecter ce qui a changé ─────────────────────────────────────────
      - name: Detect changes
        id: changes
        run: |
          HEROIC_CHANGED=false
          LEG_CHANGED=false
          ANY=false

          [ "${{ steps.upstream.outputs.heroic }}"    != "${{ steps.current.outputs.heroic }}"    ] \
            && HEROIC_CHANGED=true && ANY=true
          [ "${{ steps.upstream.outputs.legendary }}" != "${{ steps.current.outputs.legendary }}" ] \
            && LEG_CHANGED=true    && ANY=true

          echo "heroic=$HEROIC_CHANGED"   >> "$GITHUB_OUTPUT"
          echo "legendary=$LEG_CHANGED"   >> "$GITHUB_OUTPUT"
          echo "any=$ANY"                 >> "$GITHUB_OUTPUT"

          echo "=== Changements détectés ==="
          echo "heroic:      $HEROIC_CHANGED"
          echo "legendary-gl: $LEG_CHANGED"

      # ── 4a. Hash source Heroic ───────────────────────────────────────────────
      - name: Compute heroic src hash
        if: steps.changes.outputs.heroic == 'true'
        id: hash_heroic_src
        run: |
          TAG="${{ steps.upstream.outputs.heroic_tag }}"
          HASH=$(nix-prefetch-url --unpack \
            "https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/archive/refs/tags/${TAG}.tar.gz" \
            2>/dev/null | tail -1 | xargs nix hash convert --hash-algo sha256 --to sri)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "heroic src hash: $HASH"

      # ── 4b. Hash pnpmDeps ─────────────────────────────────────────────────────
      - name: Compute pnpm deps hash
        if: steps.changes.outputs.heroic == 'true'
        id: hash_pnpm
        env:
          HEROIC_NEW: ${{ steps.upstream.outputs.heroic }}
          SRC_HASH: ${{ steps.hash_heroic_src.outputs.hash }}
        run: |
          python3 - <<'EOF'
          import re, os

          content = open("pkgs/heroic/default.nix").read()

          heroic_new = os.environ["HEROIC_NEW"]
          src_hash   = os.environ["SRC_HASH"]

          # version
          content = re.sub(r'(version\s*=\s*")[^"]*(")', rf'\g<1>{heroic_new}\2', content, count=1)
          # 1ère occurrence de hash = src
          content = re.sub(r'(hash\s*=\s*")[^"]*(")', rf'\g<1>{src_hash}\2', content, count=1)
          # 2ème occurrence de hash = pnpmDeps → vide pour déclencher l'erreur nix
          count = [0]
          def empty_second(m):
              count[0] += 1
              return m.group(1) + m.group(2) if count[0] == 2 else m.group(0)
          content = re.sub(r'(hash\s*=\s*")[^"]*(")', empty_second, content)

          open("pkgs/heroic/default.nix", "w").write(content)
          EOF

          echo "=== default.nix patché pour probe ==="
          git diff pkgs/heroic/default.nix

          NIX_OUTPUT=$(nix build .#heroic-custom 2>&1) || true
          echo "$NIX_OUTPUT"

          HASH=$(echo "$NIX_OUTPUT" | grep 'got:' | awk '{print $2}' | head -1)

          git checkout pkgs/heroic/default.nix

          if [[ "$HASH" != sha256-* ]]; then
            echo "ERREUR: hash pnpm invalide. Sortie nix build:"
            echo "$NIX_OUTPUT"
            exit 1
          fi

          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "pnpm deps hash: $HASH"

      # ── 4c. Hash source legendary-gl ─────────────────────────────────────────
      # Simple fetchFromGitHub, pas de FOD à sonder : un seul hash à calculer.
      - name: Compute legendary-gl src hash
        if: steps.changes.outputs.legendary == 'true'
        id: hash_legendary
        run: |
          VER="${{ steps.upstream.outputs.legendary }}"
          HASH=$(nix-prefetch-url --unpack \
            "https://github.com/legendary-gl/legendary/archive/refs/tags/${VER}.tar.gz" \
            2>/dev/null | tail -1 | xargs nix hash convert --hash-algo sha256 --to sri)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "legendary-gl src hash: $HASH"

      # ── 5a. Patcher default.nix (Heroic) ─────────────────────────────────────
      - name: Patch default.nix
        if: steps.changes.outputs.heroic == 'true'
        env:
          HEROIC_NEW: ${{ steps.upstream.outputs.heroic }}
          SRC_HASH: ${{ steps.hash_heroic_src.outputs.hash }}
          PNPM_HASH: ${{ steps.hash_pnpm.outputs.hash }}
        run: |
          python3 - <<'EOF'
          import re, os

          content = open("pkgs/heroic/default.nix").read()

          heroic_new = os.environ["HEROIC_NEW"]
          src_hash   = os.environ["SRC_HASH"]
          pnpm_hash  = os.environ["PNPM_HASH"]

          # version
          content = re.sub(r'(version\s*=\s*")[^"]*(")', rf'\g<1>{heroic_new}\2', content, count=1)
          # 1ère occurrence de hash = src
          content = re.sub(r'(hash\s*=\s*")[^"]*(")', rf'\g<1>{src_hash}\2', content, count=1)
          # 2ème occurrence de hash = pnpmDeps
          count = [0]
          def replace_pnpm(m):
              count[0] += 1
              return m.group(1) + pnpm_hash + m.group(2) if count[0] == 2 else m.group(0)
          content = re.sub(r'(hash\s*=\s*")[^"]*(")', replace_pnpm, content)

          open("pkgs/heroic/default.nix", "w").write(content)
          EOF

          echo "=== default.nix après patch ==="
          git diff pkgs/heroic/default.nix

      # ── 5b. Patcher legendary-gl.nix ─────────────────────────────────────────
      - name: Patch legendary-gl.nix
        if: steps.changes.outputs.legendary == 'true'
        env:
          LEG_NEW: ${{ steps.upstream.outputs.legendary }}
          LEG_HASH: ${{ steps.hash_legendary.outputs.hash }}
        run: |
          LEG="pkgs/heroic/legendary-gl.nix"
          sed -i "s|version = \"[^\"]*\"|version = \"${LEG_NEW}\"|"   "$LEG"
          sed -i "s|hash = \"sha256-[^\"]*\"|hash = \"${LEG_HASH}\"|" "$LEG"

          echo "=== legendary-gl.nix après patch ==="
          git diff "$LEG"

      # ── 6. Heroic a-t-il vraiment besoin de cette version de legendary ? ────
      # Non-bloquant : Heroic écrit parfois "Update Legendary to X.Y.Z" dans
      # ses release notes. On compare à ce qu'on vient de patcher (ou à
      # défaut à la version courante) pour être averti d'un écart — sans
      # jamais faire échouer le build sur la base d'un simple grep de texte
      # libre. Utile si legendary-gl publie un tag *après* qu'Heroic en ait
      # parlé, ou si le libellé de version diverge légèrement.
      - name: Check legendary compatibility hint
        if: steps.changes.outputs.heroic == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEROIC_CUR: ${{ steps.current.outputs.heroic }}
        run: |
          set +e

          RESOLVED_LEG="${{ steps.upstream.outputs.legendary }}"
          [ "${{ steps.changes.outputs.legendary }}" != "true" ] && RESOLVED_LEG="${{ steps.current.outputs.legendary }}"

          TAGS=$(gh api repos/Heroic-Games-Launcher/HeroicGamesLauncher/releases --paginate -q '.[].tag_name')

          MENTIONED=""
          for TAG in $TAGS; do
            VER="${TAG#v}"
            [ "$VER" = "$HEROIC_CUR" ] && break

            BODY=$(gh api "repos/Heroic-Games-Launcher/HeroicGamesLauncher/releases/tags/$TAG" -q .body)
            HIT=$(echo "$BODY" | grep -ioE 'legendary.{0,15}(to|v)[[:space:]]*[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
            if [ -n "$HIT" ]; then
              MENTIONED="$HIT (release $TAG)"
              break
            fi
          done

          if [ -z "$MENTIONED" ]; then
            echo "=== Aucune mention de Legendary dans les changelogs Heroic depuis $HEROIC_CUR ==="
            exit 0
          fi

          echo "=== Legendary mentionné dans le changelog Heroic ==="
          echo "$MENTIONED"
          echo "legendary-gl chez nous (après ce run) : $RESOLVED_LEG"

          if ! echo "$MENTIONED" | grep -q "$RESOLVED_LEG"; then
            echo "::warning::Heroic ${{ steps.upstream.outputs.heroic }} mentionne un changement Legendary ($MENTIONED) qui ne correspond pas à legendary-gl $RESOLVED_LEG. legendary-gl n'a peut-être pas encore de tag correspondant, ou le libellé diverge — vérifier manuellement."
          else
            echo "Version cohérente, rien à signaler."
          fi

      # ── 7. Build + push cachix ────────────────────────────────────────────────
      - name: Build heroic-custom
        if: steps.changes.outputs.any == 'true'
        run: |
          nix build .#heroic-custom --print-build-logs

      # ── 8. Commit + push direct sur main ────────────────────────────────────
      - name: Commit and push
        if: steps.changes.outputs.any == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pkgs/heroic/default.nix pkgs/heroic/legendary-gl.nix

          MSG=""
          if [ "${{ steps.changes.outputs.heroic }}" = "true" ]; then
            MSG+="heroic: ${{ steps.current.outputs.heroic }} → ${{ steps.upstream.outputs.heroic }}"
          fi
          if [ "${{ steps.changes.outputs.legendary }}" = "true" ]; then
            [ -n "$MSG" ] && MSG+=$'\n\n'
            MSG+="legendary-gl: ${{ steps.current.outputs.legendary }} → ${{ steps.upstream.outputs.legendary }}"
          fi

          git commit -m "$MSG"
          git push origin HEAD:main
