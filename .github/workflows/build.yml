name: Update and build packages

on:
  schedule:
    - cron: "0 8 * * *" # tous les jours à 8h
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: roudix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # ── 1. Version courante extraite du fichier nix ───────────────────────
      # Legendary n'est plus packagé ici : on utilise legendary-gl de nixpkgs,
      # dont la version suit le pin de l'input nixpkgs du flake, pas ce repo.
      - name: Read current version
        id: current
        run: |
          NIX="pkgs/heroic/default.nix"
          HEROIC_CUR=$(grep -oP 'version\s*=\s*"\K[^"]+' "$NIX" | head -1)

          echo "heroic=$HEROIC_CUR" >> "$GITHUB_OUTPUT"

          echo "=== Version actuelle ==="
          echo "heroic: $HEROIC_CUR"

      # ── 2. Version upstream ────────────────────────────────────────────────
      - name: Fetch upstream version
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEROIC_TAG=$(gh release view \
            --repo Heroic-Games-Launcher/HeroicGamesLauncher \
            --json tagName -q .tagName)
          HEROIC_NEW="${HEROIC_TAG#v}"

          echo "heroic=$HEROIC_NEW"     >> "$GITHUB_OUTPUT"
          echo "heroic_tag=$HEROIC_TAG" >> "$GITHUB_OUTPUT"

          echo "=== Version upstream ==="
          echo "heroic: $HEROIC_NEW"

      # ── 2b. Heroic mentionne-t-il un bump de Legendary dans son changelog ? ─
      # Non-bloquant : Heroic écrit parfois "Update Legendary to X.Y.Z" dans
      # ses release notes. On compare à la version épinglée par legendary-gl
      # dans notre nixpkgs, pour être averti si un écart apparaît — sans
      # jamais faire échouer le build sur la base d'un simple grep de texte
      # libre.
      - name: Check legendary compatibility hint
        id: legendary_check
        if: steps.upstream.outputs.heroic != steps.current.outputs.heroic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEROIC_CUR: ${{ steps.current.outputs.heroic }}
        run: |
          set +e

          # Toutes les releases Heroic publiées depuis notre version actuelle
          # (exclue) jusqu'à la nouvelle (incluse), plus anciennes en dernier.
          TAGS=$(gh api \
            repos/Heroic-Games-Launcher/HeroicGamesLauncher/releases \
            --paginate -q '.[].tag_name')

          MENTIONED=""
          for TAG in $TAGS; do
            VER="${TAG#v}"
            # On s'arrête dès qu'on retombe sur la version actuelle : tout ce
            # qui est au-dessus a été publié depuis notre dernier bump.
            [ "$VER" = "$HEROIC_CUR" ] && break

            BODY=$(gh api "repos/Heroic-Games-Launcher/HeroicGamesLauncher/releases/tags/$TAG" -q .body)
            HIT=$(echo "$BODY" | grep -ioE 'legendary.{0,15}(to|v)[[:space:]]*[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
            if [ -n "$HIT" ]; then
              MENTIONED="$HIT (release $TAG)"
              break
            fi
          done

          if [ -n "$MENTIONED" ]; then
            echo "mentioned=true" >> "$GITHUB_OUTPUT"
            echo "detail=$MENTIONED" >> "$GITHUB_OUTPUT"
            echo "=== Legendary mentionné dans le changelog Heroic ==="
            echo "$MENTIONED"
          else
            echo "mentioned=false" >> "$GITHUB_OUTPUT"
            echo "=== Aucune mention de Legendary dans les changelogs depuis $HEROIC_CUR ==="
          fi

      - name: Compare with pinned legendary-gl version
        if: steps.legendary_check.outputs.mentioned == 'true'
        run: |
          PINNED=$(nix eval --raw .#heroic-custom.legendary-gl.version 2>/dev/null)
          echo "legendary-gl épinglé dans notre nixpkgs : $PINNED"
          echo "Changelog Heroic mentionne : ${{ steps.legendary_check.outputs.detail }}"

          if ! echo "${{ steps.legendary_check.outputs.detail }}" | grep -q "$PINNED"; then
            echo "::warning::Heroic ${{ steps.upstream.outputs.heroic }} mentionne un changement Legendary (${{ steps.legendary_check.outputs.detail }}) qui ne correspond pas à legendary-gl $PINNED épinglé par notre nixpkgs. Vérifier la compatibilité runtime (login/installation de jeux Epic) et éventuellement mettre à jour l'input nixpkgs."
          else
            echo "Version cohérente avec notre pin nixpkgs, rien à signaler."
          fi

      # ── 3. Détecter ce qui a changé ────────────────────────────────────────
      - name: Detect changes
        id: changes
        run: |
          HEROIC_CHANGED=false

          [ "${{ steps.upstream.outputs.heroic }}" != "${{ steps.current.outputs.heroic }}" ] \
            && HEROIC_CHANGED=true

          echo "heroic=$HEROIC_CHANGED" >> "$GITHUB_OUTPUT"

          echo "=== Changement détecté ==="
          echo "heroic: $HEROIC_CHANGED"

      # ── 4a. Hash source Heroic ─────────────────────────────────────────────
      - name: Compute heroic src hash
        if: steps.changes.outputs.heroic == 'true'
        id: hash_heroic_src
        run: |
          TAG="${{ steps.upstream.outputs.heroic_tag }}"
          HASH=$(nix-prefetch-url --unpack \
            "https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/archive/refs/tags/${TAG}.tar.gz" \
            2>/dev/null | tail -1 | xargs nix hash convert --hash-algo sha256 --to sri)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "heroic src hash: $HASH"

      # ── 4b. Hash pnpmDeps ──────────────────────────────────────────────────
      - name: Compute pnpm deps hash
        if: steps.changes.outputs.heroic == 'true'
        id: hash_pnpm
        env:
          HEROIC_NEW: ${{ steps.upstream.outputs.heroic }}
          SRC_HASH: ${{ steps.hash_heroic_src.outputs.hash }}
        run: |
          python3 - <<'EOF'
          import re, os

          content = open("pkgs/heroic/default.nix").read()

          heroic_new = os.environ["HEROIC_NEW"]
          src_hash   = os.environ["SRC_HASH"]

          # version
          content = re.sub(r'(version\s*=\s*")[^"]*(")', rf'\g<1>{heroic_new}\2', content, count=1)
          # 1ère occurrence de hash = src
          content = re.sub(r'(hash\s*=\s*")[^"]*(")', rf'\g<1>{src_hash}\2', content, count=1)
          # 2ème occurrence de hash = pnpmDeps → vide pour déclencher l'erreur nix
          count = [0]
          def empty_second(m):
              count[0] += 1
              return m.group(1) + m.group(2) if count[0] == 2 else m.group(0)
          content = re.sub(r'(hash\s*=\s*")[^"]*(")', empty_second, content)

          open("pkgs/heroic/default.nix", "w").write(content)
          EOF

          echo "=== default.nix patché pour probe ==="
          git diff pkgs/heroic/default.nix

          NIX_OUTPUT=$(nix build .#heroic-custom 2>&1) || true
          echo "$NIX_OUTPUT"

          HASH=$(echo "$NIX_OUTPUT" | grep 'got:' | awk '{print $2}' | head -1)

          git checkout pkgs/heroic/default.nix

          if [[ "$HASH" != sha256-* ]]; then
            echo "ERREUR: hash pnpm invalide. Sortie nix build:"
            echo "$NIX_OUTPUT"
            exit 1
          fi

          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "pnpm deps hash: $HASH"

      # ── 5. Patcher default.nix ─────────────────────────────────────────────
      - name: Patch default.nix
        if: steps.changes.outputs.heroic == 'true'
        env:
          HEROIC_NEW: ${{ steps.upstream.outputs.heroic }}
          SRC_HASH: ${{ steps.hash_heroic_src.outputs.hash }}
          PNPM_HASH: ${{ steps.hash_pnpm.outputs.hash }}
        run: |
          python3 - <<'EOF'
          import re, os

          content = open("pkgs/heroic/default.nix").read()

          heroic_new = os.environ["HEROIC_NEW"]
          src_hash   = os.environ["SRC_HASH"]
          pnpm_hash  = os.environ["PNPM_HASH"]

          # version
          content = re.sub(r'(version\s*=\s*")[^"]*(")', rf'\g<1>{heroic_new}\2', content, count=1)
          # 1ère occurrence de hash = src
          content = re.sub(r'(hash\s*=\s*")[^"]*(")', rf'\g<1>{src_hash}\2', content, count=1)
          # 2ème occurrence de hash = pnpmDeps
          count = [0]
          def replace_pnpm(m):
              count[0] += 1
              return m.group(1) + pnpm_hash + m.group(2) if count[0] == 2 else m.group(0)
          content = re.sub(r'(hash\s*=\s*")[^"]*(")', replace_pnpm, content)

          open("pkgs/heroic/default.nix", "w").write(content)
          EOF

          echo "=== default.nix après patch ==="
          git diff pkgs/heroic/default.nix

      # ── 6. Build + push cachix ─────────────────────────────────────────────
      - name: Build heroic-custom
        if: steps.changes.outputs.heroic == 'true'
        run: |
          nix build .#heroic-custom --print-build-logs

      # ── 7. Commit + push direct sur main ───────────────────────────────────
      - name: Commit and push
        if: steps.changes.outputs.heroic == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pkgs/heroic/default.nix

          MSG="heroic: ${{ steps.current.outputs.heroic }} → ${{ steps.upstream.outputs.heroic }}"

          if [ "${{ steps.legendary_check.outputs.mentioned }}" = "true" ]; then
            MSG+=$'\n\n'"⚠️ Changelog Heroic mentionne Legendary : ${{ steps.legendary_check.outputs.detail }} — vérifier legendary-gl (nixpkgs)."
          fi

          git commit -m "$MSG"
          git push origin HEAD:main
